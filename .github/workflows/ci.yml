name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: audittrail
          POSTGRES_PASSWORD: audittrail
          POSTGRES_DB: audittrail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audittrail -d audittrail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check audittrail tests

      - name: Mypy
        run: mypy audittrail

      - name: Pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://audittrail:audittrail@localhost:5432/audittrail_test
          REDIS_URL: redis://localhost:6379/0
          API_KEY_PEPPER: test-pepper
          BOOTSTRAP_ADMIN_TOKEN: test-bootstrap-admin
          DEBUG: "true"
        run: pytest -q --cov=audittrail --cov-report=term-missing
